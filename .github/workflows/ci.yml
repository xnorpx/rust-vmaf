name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (stable)
            os: ubuntu-latest
            rust: stable
            cargo_args: ''
          - name: Linux x86_64 (beta)
            os: ubuntu-latest
            rust: beta
            cargo_args: ''
          - name: Linux x86_64 (nightly)
            os: ubuntu-latest
            rust: nightly
            cargo_args: ''
          - name: Linux x86_64 (all features)
            os: ubuntu-latest
            rust: stable
            cargo_args: '--all-features'
          - name: Linux x86_64 (no default features)
            os: ubuntu-latest
            rust: stable
            cargo_args: '--no-default-features'
          - name: Linux x86_64 (native CPU)
            os: ubuntu-latest
            rust: stable
            cargo_args: '--all-features'
            rustflags: '-C target-cpu=native'
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            rust: stable
            cargo_args: ''
          - name: macOS native
            os: macos-latest
            rust: stable
            cargo_args: ''

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja
        run: python -m pip install meson ninja

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm xxd

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build and test
        run: cargo test --verbose ${{ matrix.cargo_args }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}

  build-windows:
    name: Windows x86_64 (GNU)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Install MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ninja
            vim

      - name: Build and test
        run: cargo test --target x86_64-pc-windows-gnu --verbose

  build-windows-msvc:
    name: Windows x86_64 (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install native dependencies
        run: |
          python -m pip install meson ninja
          choco install nasm --no-progress -y
          $tools = Join-Path $env:RUNNER_TEMP 'vmaf-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item 'C:\Program Files\Git\usr\bin\xxd.exe' $tools
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $tools 'xxd.exe') -v

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build and test
        run: cargo test --target x86_64-pc-windows-msvc --verbose

      - name: Build and test with native CPU tuning
        run: cargo test --target x86_64-pc-windows-msvc --verbose
        env:
          CARGO_TARGET_DIR: target/native
          RUSTFLAGS: -C target-cpu=native

  build-ios:
    name: iOS compile and link
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '12.0'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install native dependencies
        run: |
          python -m pip install meson ninja
          brew install nasm

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-apple-ios,
            aarch64-apple-ios-sim,
            x86_64-apple-ios

      - name: Link iPhone ARM64 tests
        run: cargo test --lib --target aarch64-apple-ios --no-run --verbose

      - name: Link iPhone simulator ARM64 tests
        run: cargo test --lib --target aarch64-apple-ios-sim --no-run --verbose

      - name: Link iPhone simulator x86_64 tests
        run: cargo test --lib --target x86_64-apple-ios --no-run --verbose

  build-android:
    name: Android compile and link
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install native dependencies
        run: |
          python -m pip install meson ninja
          sudo apt-get update
          sudo apt-get install -y nasm xxd

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Link Android ARM64 tests
        run: >-
          cargo ndk --platform 24 --target arm64-v8a
          --link-builtins --link-libcxx-shared
          test --lib --no-run --verbose
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Link Android ARMv7 tests
        run: >-
          cargo ndk --platform 24 --target armeabi-v7a
          --link-builtins --link-libcxx-shared
          test --lib --no-run --verbose
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Link Android x86_64 tests
        run: >-
          cargo ndk --platform 24 --target x86_64
          --link-builtins --link-libcxx-shared
          test --lib --no-run --verbose
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Link Android x86 tests
        run: >-
          cargo ndk --platform 24 --target x86
          --link-builtins --link-libcxx-shared
          test --lib --no-run --verbose
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

  lint:
    name: Lint and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install native dependencies
        run: |
          python -m pip install meson ninja
          sudo apt-get update
          sudo apt-get install -y nasm xxd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test build configuration
        run: |
          rustc --edition=2021 --test build.rs -o target/build-script-tests
          target/build-script-tests

      - name: Verify package
        run: cargo package

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build docs
        run: cargo doc --all-features --no-deps
        env:
          DOCS_RS: '1'
          RUSTDOCFLAGS: -D warnings